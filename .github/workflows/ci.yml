name: ci

# Pull requests and main run the same checks as `make verify`, with no cloud
# access at all: no id-token permission, no secrets, no role to assume.
# Shared checks come from reusable workflows in gamaware/.github. The verify
# job runs `make verify`, so local runs and CI cannot drift apart.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    name: lint-docs
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-docs.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9

  lint-actions:
    name: lint-actions
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-actions.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9

  secrets:
    name: secrets
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/secrets.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9

  security:
    name: security
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/security.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9
    with:
      checkov-config: .checkov.yaml

  terraform:
    name: terraform
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/terraform.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9
    with:
      working-directories: '["infra/terraform/data", "infra/terraform/knowledge-base", "infra/terraform/api"]'
      terraform-version: 1.14.5
      tflint-version: v0.61.0

  # Builds report/REPORT.pdf in the pinned pandoc/latex image. The arguments
  # match PANDOC_ARGS in scripts/build_report.py, which builds the committed PDF.
  report:
    name: report
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/report.yml@1e2fe2d99f7772ad59b896f332557457ebcbdde9
    with:
      report-path: report/REPORT.md
      pandoc-args: >-
        --pdf-engine=xelatex -V geometry:margin=2.2cm -V papersize=a4 --toc --shift-heading-level-by=-1
        -V header-includes=\RecustomVerbatimEnvironment{Highlighting}{Verbatim}{commandchars=\\\{\},fontsize=\scriptsize}

  verify:
    name: make verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SHELLHARDEN_VERSION: "4.3.2"
      SHELLHARDEN_SHA256: e81e97bc6bccff59b826d3b39328ab19b26721a236440f740ba71754531c7286
      SEMGREP_VERSION: "1.178.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Install shellharden and Semgrep
        run: |
          set -euo pipefail
          archive="shellharden-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/anordal/shellharden/releases/download/v${SHELLHARDEN_VERSION}/${archive}"
          echo "${SHELLHARDEN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" shellharden
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          uv tool install "semgrep==${SEMGREP_VERSION}"

      - name: Python dependencies
        run: uv sync --frozen

      - name: Tests, evaluation gates, report check, Terraform, Checkov, Trivy, Semgrep, shell
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the AWS ruleset
        run: make verify
