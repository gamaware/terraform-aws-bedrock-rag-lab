version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/data
      - /infra/terraform/knowledge-base
      - /infra/terraform/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
